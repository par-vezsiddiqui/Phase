<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Submit Feedback</title>
</head>
<body>
  <header>  
    <h1>Submit Feedback</h1>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="profile.html">Profile</a></li>
        <li><a href="courses.html">Courses</a></li>
        <li><a href="feedback.html">Feedback</a></li>
        <li><a href="grades.html">Grades</a></li>
        <li><a href="contact.html">Contact Us</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <form action="#" method="post">
      <p>
        <label for="name">Full Name:</label><br>
        <input type="text" id="name" name="name" required>
      </p>

      <p>
        <label for="email">Email Address:</label><br>
        <input type="email" id="email" name="email" required>
      </p>

      <p>
        <label for="rating">Rating:</label><br>
        <select id="rating" name="rating">
          <option value="excellent">Excellent</option>
          <option value="good">Good</option>
          <option value="average">Average</option>
          <option value="poor">Poor</option>
        </select>
      </p>

      <p>
        <label for="comments">Feedback:</label><br>
        <textarea id="comments" name="comments" rows="5" cols="40"></textarea>
      </p>

      <p>
        <input type="checkbox" id="followup" name="followup">
        <label for="followup">I would like a follow-up response.</label>
      </p>

      <p>
        <button type="submit">Submit Feedback</button>
      </p>
    </form>
  </main>

  <footer>
    <p>&copy; 2026 Student Portal. All rights reserved.</p>
  </footer>
</body>
</html>
